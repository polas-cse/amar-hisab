plugins {
    id 'com.android.application'
}

android {
    namespace 'com.polas.betonkhata'
    compileSdk 34

    defaultConfig {
        applicationId "com.polas.betonkhata"
        minSdk 24          // Android 7.0+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // নিজের keystore না থাকলে debug key দিয়েই সাইন — ভাইয়ের ফোনে ইনস্টলের জন্য যথেষ্ট
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// কোনো লাইব্রেরি dependency নেই — শুধু Android framework
